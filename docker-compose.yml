services:
  postgres:
    image: postgres:16-alpine
    container_name: dormflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dormpass
      POSTGRES_DB: dormflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dormflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data: